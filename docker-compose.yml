version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"

  go-portal:
    build: .
    container_name: go-portal
    depends_on:
      - mosquitto
    ports:
      - "8080:8080"
    environment:
      - MQTT_BROKER=mosquitto